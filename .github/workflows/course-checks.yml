name: Course checks

# What a course project is asked on every push: does the material still pass
# its pre-ship checks, and does the site still build. Both questions are about
# content the author owns, which is what separates this workflow from
# `test.yml` — that one tests the tooling, and is gated to the repository the
# tooling lives in.
#
# Deliberately ungated, so it runs here too. This repository is the only place
# a break in this file can be caught before every course inherits it, and
# `course/01-getting-started/` gives it real material to check. The cost is one
# build duplicated with `test.yml`, on this repository alone.
#
# No matrix: this asks a question about markdown, and the answer does not vary
# by operating system.

on:
  push:
  workflow_dispatch:

jobs:
  course:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci

      # Every pre-ship check: frontmatter, links and file references through
      # `validate`, glossary freshness when the course keeps a glossary, the
      # plain link check, and whatever `checks.extra` in course.config.yml adds.
      # Local and offline — it never reaches Canvas — and `validate` fails the
      # run on an error while letting a warning through, so a course is not
      # held to more than it should be.
      - run: npx course check

      # The same build GitHub Pages runs, so a page that cannot compile is
      # caught on the push that wrote it. Worth its own step precisely because
      # `deploy.yml` builds only on the default branch, and only once Pages has
      # been switched on: without this, a course that has not got that far
      # collects skipped deploys and never hears that a page is broken.
      - run: npm run build
