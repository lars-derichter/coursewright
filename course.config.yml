# Per-course settings: name, language, look, and label overrides.
# This file is protected during upstream updates (see update-from-upstream.conf).

# The name of this course. Titles the preview site and its navbar, and heads the
# cover of a PDF or DOCX export of the whole course. Leave it out and it falls
# back to the generic label for the language below ("Course", "Cursus"), so set
# it to something of your own.
title: Coursewright

# A one-line descriptor of the course: programme, year, semester. Optional.
# Printed above the title on export covers.
# tagline: Bachelor 1, semester 2

# Colour and site typography, for the preview site, Canvas HTML and PDF
# exports alike. Built-in themes: github, thomas-more. The value is a name
# under src/css/themes/, or a path to a CSS file of your own. Copy a built-in
# into sources/ and point at it there. See docs/customization.md.
theme: github

# PDF and DOCX layout: typography, margins, cover, bundled fonts. Built-in
# styles: generic, thomas-more. The value is a folder name under
# export-styles/, or a path to a folder of your own. See
# docs/export-styling.md.
export:
  style: generic

# Pre-ship checks: what `npx course check` runs and the pre-push hook gates.
# `links.roots` lists the folders check-links scans for broken relative links
# (default: course). `extra` lists subcommands check runs after its built-in
# list, each written as you would type it after `npx course`, so a command your
# course registered itself is gated too. See docs/customisation.md.
# checks:
#   links:
#     roots: [course, games]
#   extra:
#     - build-games

# Course-facing label language. Built-in sets: en, nl.
# Individual labels can be overridden under `labels:`; anything you leave out
# falls back to the built-in set for the language above. The commented block
# shows the full override surface, with values that differ from the English
# defaults so you can see what each key controls.
language: en

